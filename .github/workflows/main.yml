# CI: install and verify on every push/PR to main
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify forge config
        run: npx electron-forge --version

# Release: build native installers for macOS and Windows on version tags
  release-mac:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Make (macOS DMG + ZIP)
        run: npm run make -- --platform darwin
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tules-macos
          path: out/make/**/*

  release-win:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Make (Windows Squirrel installer)
        run: npm run make -- --platform win32
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tules-windows
          path: out/make/**/*
